<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free WiFi - Sambungkan ke Internet</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0b63f6 0%, #0a3fa8 100%);
    color: #1b1f24;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #fff; width: 100%; max-width: 380px; border-radius: 20px;
    padding: 32px 24px 24px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .icon {
    width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 50%;
    background: #e8f0ff; display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 42px; height: 42px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .ssid { color: #5b6573; font-size: .95rem; margin: 0 0 20px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; font-size: .85rem;
    background: #eaf8ef; color: #17803d; padding: 6px 12px; border-radius: 999px;
    margin-bottom: 22px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .info {
    text-align: left; font-size: .9rem; color: #38414d; background: #f5f7fa;
    border-radius: 12px; padding: 14px 16px; margin-bottom: 22px; line-height: 1.7;
  }
  .info b { color: #1b1f24; }
  #connect {
    width: 100%; border: 0; border-radius: 12px; padding: 16px;
    background: #0b63f6; color: #fff; font: 700 1.05rem system-ui, sans-serif;
    cursor: pointer;
  }
  #connect:hover, #connect:focus-visible { background: #0952cf; }
  #connect:active { transform: scale(.98); }
  .terms { font-size: .75rem; color: #8a94a3; margin: 14px 0 0; line-height: 1.5; }

  #stage { position: fixed; inset: 0; background: #000; display: none; z-index: 5; }
  #stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #err {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #fff; text-align: center; padding: 24px; font-size: 1rem;
  }
</style>
</head>
<body>

<main class="card" id="portal">
  <div class="icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0b63f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.8a15 15 0 0 1 20 0"/>
      <path d="M5.5 12.4a10 10 0 0 1 13 0"/>
      <path d="M9 16a5 5 0 0 1 6 0"/>
      <circle cx="12" cy="19.5" r="1" fill="#0b63f6"/>
    </svg>
  </div>

  <h1>Free WiFi</h1>
  <p class="ssid">Jaringan: Free_WiFi_Gratis</p>

  <div class="status"><span class="dot"></span> Sinyal kuat · Tanpa kata sandi</div>

  <div class="info">
    <div><b>Kecepatan:</b> hingga 50 Mbps</div>
    <div><b>Durasi:</b> 24 jam gratis</div>
    <div><b>Biaya:</b> Rp0</div>
  </div>

  <button id="connect" type="button">Sambungkan ke Internet</button>

  <p class="terms">Dengan menekan tombol di atas, Anda menyetujui Syarat &amp; Ketentuan penggunaan jaringan.</p>
</main>

<div id="stage">
  <video id="vid" src="https://dikakita.my.id/gallery/gg.mp4" playsinline loop preload="auto"></video>
  <div id="err">Video tidak dapat dimuat.</div>
</div>

<script>
  var btn = document.getElementById('connect');
  var portal = document.getElementById('portal');
  var stage = document.getElementById('stage');
  var vid = document.getElementById('vid');
  var err = document.getElementById('err');

  btn.addEventListener('click', function () {
    portal.style.display = 'none';
    document.body.style.background = '#000';
    stage.style.display = 'block';

    vid.muted = false;
    vid.volume = 1;
    var p = vid.play();
    if (p && p.catch) {
      p.catch(function () { err.style.display = 'flex'; });
    }
    vid.addEventListener('error', function () { err.style.display = 'flex'; });

    // Coba layar penuh (diabaikan jika browser tidak mengizinkan)
    var el = document.documentElement;
    var rf = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rf) { try { var r = rf.call(el); if (r && r.catch) r.catch(function(){}); } catch (e) {} }
  });
</script>
</body>
</html>
