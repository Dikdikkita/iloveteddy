<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klik untuk melanjutkan</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #cover {
    position: fixed; inset: 0; z-index: 2; display: flex; align-items: center;
    justify-content: center; background: #111; margin: 0; padding: 0; border: 0;
    cursor: pointer;
  }
  #cover span {
    background: #fff; color: #111; font: 700 1.25rem/1 system-ui, sans-serif;
    padding: 1em 2em; border-radius: 999px;
  }
  #cover:hover span, #cover:focus-visible span { background: #e8e8e8; }
</style>
</head>
<body>

<button id="cover" type="button" aria-label="Klik untuk melanjutkan">
  <span>Klik untuk melanjutkan</span>
</button>

<script>
  document.getElementById('cover').addEventListener('click', function () {
    // iframe dibuat saat klik, jadi browser mengizinkan autoplay dengan suara
    var f = document.createElement('iframe');
    f.src = 'https://dikakita.my.id/gallery/gg.mp4';
    f.title = 'Video';
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.allowFullscreen = true;
    document.body.appendChild(f);
    this.remove();
  });
</script>
</body>
</html>
